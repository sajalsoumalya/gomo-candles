<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#1d1915" />
  <title>GoMo Admin</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="img/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
<!-- Product illustrations (same artwork as the shop) -->
<svg class="sprite" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e2f12"/><stop offset=".35" stop-color="#b8612b"/><stop offset=".6" stop-color="#d07a3c"/><stop offset="1" stop-color="#5e260d"/>
    </linearGradient>
    <linearGradient id="gWax" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6d9a8"/><stop offset="1" stop-color="#e2a861"/></linearGradient>
    <linearGradient id="gFlame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f97316"/><stop offset=".55" stop-color="#fbbf24"/><stop offset="1" stop-color="#fff7d6"/></linearGradient>
    <radialGradient id="gGlow"><stop offset="0" stop-color="#ffcf7a" stop-opacity=".75"/><stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/></radialGradient>
    <linearGradient id="gSage" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cfe0d7"/><stop offset=".5" stop-color="#8db0a0"/><stop offset="1" stop-color="#4f7464"/></linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a87628"/><stop offset=".45" stop-color="#f0d39a"/><stop offset=".7" stop-color="#d9a957"/><stop offset="1" stop-color="#94641d"/></linearGradient>
    <linearGradient id="gCap" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a2420"/><stop offset=".5" stop-color="#5a4f46"/><stop offset="1" stop-color="#1e1916"/></linearGradient>
    <linearGradient id="gBox" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3e6d6"/><stop offset="1" stop-color="#d8c2a8"/></linearGradient>
    <linearGradient id="gStone" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cfc4b5"/><stop offset=".4" stop-color="#ece5da"/><stop offset=".75" stop-color="#ddd3c5"/><stop offset="1" stop-color="#b9ac9b"/></linearGradient>
    <linearGradient id="gPlinthTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9e3da"/><stop offset="1" stop-color="#d3cabd"/></linearGradient>
    <linearGradient id="gPlinthSide" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9bfb1"/><stop offset="1" stop-color="#a99d8d"/></linearGradient>
    <pattern id="knit" width="16" height="13" patternUnits="userSpaceOnUse">
      <path d="M0 1 Q4 11 8 1 M8 1 Q12 11 16 1" fill="none" stroke="#a88f78" stroke-width="2.4" stroke-linecap="round"/>
    </pattern>
    <pattern id="knitDark" width="14" height="11" patternUnits="userSpaceOnUse">
      <path d="M0 1 Q3.5 9 7 1 M7 1 Q10.5 9 14 1" fill="none" stroke="#6f2f14" stroke-width="2.2" stroke-linecap="round"/>
    </pattern>
    <path id="leaf" d="M0 0 C5 -7 14 -7 20 0 C14 7 5 7 0 0Z"/>
  </defs>

  <!-- evil eye brand mark -->
  <symbol id="i-eye" viewBox="0 0 200 130">
    <path d="M6 65 C38 8,162 8,194 65 C162 122,38 122,6 65Z" fill="#1e3a8a"/>
    <ellipse cx="100" cy="65" rx="54" ry="40" fill="#fff"/>
    <circle cx="100" cy="65" r="30" fill="#2d60c8"/>
    <circle cx="100" cy="65" r="17" fill="#0f1d50"/>
    <circle cx="109" cy="55" r="6.5" fill="#fff"/>
    <circle cx="100" cy="65" r="30" fill="none" stroke="#c8963e" stroke-width="4"/>
    <path d="M6 65 C38 8,162 8,194 65 C162 122,38 122,6 65Z" fill="none" stroke="#c8963e" stroke-width="5"/>
  </symbol>

  <!-- Evil Eye Candle (amber jar) -->
  <symbol id="i-candle" viewBox="0 0 120 140">
    <circle cx="60" cy="26" r="20" fill="url(#gGlow)"/>
    <path fill="url(#gFlame)" d="M60 10 C67 21 69 29 60 38 C51 29 53 21 60 10Z">
      <animate attributeName="d" dur="1.4s" repeatCount="indefinite" values="M60 10 C67 21 69 29 60 38 C51 29 53 21 60 10Z;M61 8 C69 20 68 30 60 38 C52 30 54 20 61 8Z;M60 10 C67 21 69 29 60 38 C51 29 53 21 60 10Z"/>
    </path>
    <line x1="60" y1="37" x2="60" y2="46" stroke="#2a1a10" stroke-width="2" stroke-linecap="round"/>
    <rect x="24" y="40" width="72" height="94" rx="10" fill="url(#gAmber)"/>
    <ellipse cx="60" cy="47" rx="33" ry="5" fill="url(#gWax)" opacity=".9"/>
    <rect x="24" y="40" width="72" height="6" rx="3" fill="#4a1d08" opacity=".45"/>
    <rect x="30" y="50" width="6" height="74" rx="3" fill="#fff" opacity=".18"/>
    <rect x="33" y="66" width="54" height="46" rx="3" fill="#f5eee4"/>
    <text x="60" y="78" text-anchor="middle" font-family="Oswald,Arial Narrow,sans-serif" font-size="8" font-weight="700" letter-spacing="1.5" fill="#2a2018">GOMO</text>
    <use href="#i-eye" x="48" y="82" width="24" height="15.6"/>
    <text x="60" y="106" text-anchor="middle" font-family="Oswald,Arial Narrow,sans-serif" font-size="5.4" letter-spacing="1" fill="#6b5a4a">EVIL EYE CANDLE</text>
  </symbol>

  <!-- Evil Eye Sachet -->
  <symbol id="i-sachet" viewBox="0 0 120 140">
    <path d="M42 30 C42 6 78 6 78 30" fill="none" stroke="#c8963e" stroke-width="2.5"/>
    <path d="M30 40 Q60 26 90 40 L96 112 Q98 132 76 134 L44 134 Q22 132 24 112Z" fill="url(#gSage)"/>
    <path d="M30 40 Q60 26 90 40 L91 52 Q60 40 29 52Z" fill="#fff" opacity=".22"/>
    <path d="M44 34 Q60 44 76 34" fill="none" stroke="#c8963e" stroke-width="3" stroke-linecap="round"/>
    <circle cx="60" cy="38" r="4" fill="#c8963e"/>
    <use href="#i-eye" x="38" y="70" width="44" height="28.6"/>
    <text x="60" y="120" text-anchor="middle" font-family="Oswald,Arial Narrow,sans-serif" font-size="8" font-weight="700" letter-spacing="1.5" fill="#fff">GOMO</text>
  </symbol>

  <!-- Linen Mist -->
  <symbol id="i-spray" viewBox="0 0 120 140">
    <g fill="#d9a957" opacity=".55">
      <circle cx="24" cy="22" r="2.2"><animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="16" cy="16" r="1.6"><animate attributeName="opacity" values="0;1;0" dur="2s" begin=".4s" repeatCount="indefinite"/></circle>
      <circle cx="20" cy="30" r="1.8"><animate attributeName="opacity" values="0;1;0" dur="2s" begin=".8s" repeatCount="indefinite"/></circle>
      <circle cx="10" cy="24" r="1.4"><animate attributeName="opacity" values="0;1;0" dur="2s" begin="1.2s" repeatCount="indefinite"/></circle>
    </g>
    <rect x="48" y="10" width="26" height="22" rx="4" fill="url(#gCap)"/>
    <rect x="32" y="16" width="18" height="6" rx="2" fill="#3a322c"/>
    <rect x="52" y="32" width="18" height="10" fill="#c9a15e"/>
    <path d="M40 46 Q40 40 50 40 L72 40 Q82 40 82 46 L84 126 Q84 134 76 134 L46 134 Q38 134 38 126Z" fill="url(#gGold)"/>
    <rect x="44" y="48" width="5" height="78" rx="2.5" fill="#fff" opacity=".3"/>
    <rect x="45" y="68" width="32" height="48" rx="3" fill="#fbf6ee"/>
    <use href="#i-eye" x="50" y="74" width="22" height="14.3"/>
    <text x="61" y="99" text-anchor="middle" font-family="Oswald,Arial Narrow,sans-serif" font-size="6.5" font-weight="700" letter-spacing="1" fill="#2a2018">GOMO</text>
    <text x="61" y="108" text-anchor="middle" font-family="Oswald,Arial Narrow,sans-serif" font-size="4.6" letter-spacing=".8" fill="#6b5a4a">LINEN MIST</text>
  </symbol>

  <!-- Gift Set -->
  <symbol id="i-gift" viewBox="0 0 120 140">
    <rect x="18" y="62" width="84" height="72" rx="6" fill="url(#gBox)"/>
    <rect x="12" y="50" width="96" height="20" rx="5" fill="#e9d8c2"/>
    <rect x="53" y="50" width="14" height="84" fill="#9c5530"/>
    <rect x="12" y="66" width="96" height="4" fill="#000" opacity=".06"/>
    <path d="M60 50 C44 26 22 34 32 46 C38 52 52 51 60 50Z" fill="#b8642e"/>
    <path d="M60 50 C76 26 98 34 88 46 C82 52 68 51 60 50Z" fill="#9c5530"/>
    <circle cx="60" cy="49" r="6" fill="#7f4224"/>
    <rect x="24" y="86" width="22" height="30" rx="3" fill="#fbf6ee" transform="rotate(-8 35 101)"/>
    <use href="#i-eye" x="25" y="94" width="20" height="13" transform="rotate(-8 35 101)"/>
  </symbol>

  <!-- Combo of 3: one of each product -->
  <symbol id="i-trio" viewBox="0 0 240 200">
    <ellipse cx="120" cy="190" rx="100" ry="8" fill="#000" opacity=".12"/>
    <use href="#i-spray" x="6" y="30" width="110" height="128"/>
    <use href="#i-sachet" x="124" y="38" width="108" height="126"/>
    <use href="#i-candle" x="62" y="56" width="116" height="135"/>
  </symbol>
  <!-- Packs of 3 -->
  <symbol id="i-candle3" viewBox="0 0 160 140">
    <use href="#i-candle" x="0" y="10" width="78" height="91"/>
    <use href="#i-candle" x="82" y="10" width="78" height="91"/>
    <use href="#i-candle" x="38" y="40" width="84" height="98"/>
  </symbol>
  <symbol id="i-sachet3" viewBox="0 0 160 140">
    <use href="#i-sachet" x="0" y="8" width="78" height="91"/>
    <use href="#i-sachet" x="82" y="8" width="78" height="91"/>
    <use href="#i-sachet" x="38" y="40" width="84" height="98"/>
  </symbol>
  <symbol id="i-spray3" viewBox="0 0 160 140">
    <use href="#i-spray" x="0" y="8" width="78" height="91"/>
    <use href="#i-spray" x="82" y="8" width="78" height="91"/>
    <use href="#i-spray" x="38" y="40" width="84" height="98"/>
  </symbol>

  <!-- stone vase with autumn branches -->
  <symbol id="i-vase" viewBox="0 0 260 320">
    <g fill="none" stroke="#6b3b1f" stroke-width="2.4" stroke-linecap="round">
      <path d="M140 178 C130 130 100 90 60 60"/>
      <path d="M140 178 C145 120 150 80 170 30"/>
      <path d="M142 178 C170 140 200 110 240 95"/>
      <path d="M138 178 C110 150 80 140 30 140"/>
      <path d="M141 178 C160 120 190 70 215 45"/>
    </g>
    <g>
      <use href="#leaf" fill="#b8642e" transform="translate(132 150) rotate(-140) scale(1.1)"/>
      <use href="#leaf" fill="#c97a3c" transform="translate(126 136) rotate(-40) scale(1)"/>
      <use href="#leaf" fill="#9c4f22" transform="translate(118 120) rotate(-160) scale(1.2)"/>
      <use href="#leaf" fill="#c97a3c" transform="translate(105 100) rotate(-70) scale(1.1)"/>
      <use href="#leaf" fill="#b8642e" transform="translate(90 84) rotate(-170) scale(1.2)"/>
      <use href="#leaf" fill="#d58a4a" transform="translate(78 74) rotate(-90) scale(1)"/>
      <use href="#leaf" fill="#9c4f22" transform="translate(60 60) rotate(-150) scale(1.3)"/>
      <use href="#leaf" fill="#b8642e" transform="translate(144 140) rotate(-20) scale(1.1)"/>
      <use href="#leaf" fill="#c97a3c" transform="translate(146 112) rotate(-160) scale(1.1)"/>
      <use href="#leaf" fill="#9c4f22" transform="translate(150 86) rotate(-30) scale(1.2)"/>
      <use href="#leaf" fill="#d58a4a" transform="translate(158 58) rotate(-140) scale(1.1)"/>
      <use href="#leaf" fill="#b8642e" transform="translate(170 30) rotate(-80) scale(1.3)"/>
      <use href="#leaf" fill="#c97a3c" transform="translate(160 160) rotate(20) scale(1)"/>
      <use href="#leaf" fill="#9c4f22" transform="translate(180 138) rotate(-60) scale(1.2)"/>
      <use href="#leaf" fill="#b8642e" transform="translate(200 120) rotate(30) scale(1.1)"/>
      <use href="#leaf" fill="#d58a4a" transform="translate(222 104) rotate(-50) scale(1.2)"/>
      <use href="#leaf" fill="#9c4f22" transform="translate(240 95) rotate(-10) scale(1.3)"/>
      <use href="#leaf" fill="#c97a3c" transform="translate(120 162) rotate(160) scale(1.1)"/>
      <use href="#leaf" fill="#b8642e" transform="translate(96 148) rotate(-150) scale(1.2)"/>
      <use href="#leaf" fill="#9c4f22" transform="translate(70 142) rotate(140) scale(1.1)"/>
      <use href="#leaf" fill="#d58a4a" transform="translate(45 140) rotate(-170) scale(1.3)"/>
      <use href="#leaf" fill="#b8642e" transform="translate(154 138) rotate(-10) scale(1)"/>
      <use href="#leaf" fill="#c97a3c" transform="translate(168 108) rotate(-120) scale(1.2)"/>
      <use href="#leaf" fill="#9c4f22" transform="translate(185 80) rotate(-30) scale(1.1)"/>
      <use href="#leaf" fill="#b8642e" transform="translate(200 60) rotate(-130) scale(1.2)"/>
      <use href="#leaf" fill="#d58a4a" transform="translate(215 45) rotate(-40) scale(1.3)"/>
    </g>
    <path d="M112 176 Q108 166 118 162 L162 162 Q172 166 168 176 Q215 205 212 255 Q208 305 165 312 L115 312 Q72 305 68 255 Q65 205 112 176Z" fill="url(#gStone)"/>
    <ellipse cx="140" cy="164" rx="22" ry="4" fill="#a99d8d"/>
    <g fill="#9e9182" opacity=".55">
      <circle cx="100" cy="230" r="1.6"/><circle cx="160" cy="210" r="1.2"/><circle cx="182" cy="262" r="1.8"/><circle cx="120" cy="280" r="1.3"/>
      <circle cx="140" cy="240" r="1.1"/><circle cx="90" cy="270" r="1.4"/><circle cx="170" cy="292" r="1.2"/><circle cx="196" cy="236" r="1.1"/>
    </g>
  </symbol>
</svg>
<div id="app"><div class="wrap-boot"><span class="spinner"></span>&nbsp; Loading…</div></div>
<noscript><p style="padding:24px">The admin panel needs JavaScript.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
